[project]
name = "andhrimnir"
version = "0.1.0"
description = "BBQ temperature monitor"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "bleak>=0.22",
    "aiosqlite>=0.20",
    "aioesphomeapi>=24.0",
]

[project.scripts]
andhrimnir = "andhrimnir.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/andhrimnir"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
