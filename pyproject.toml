[project]
name = "andhrimnir"
version = "0.1.0"
description = "BBQ temperature monitor"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "bleak>=0.22",
    "aiosqlite>=0.20",
]

[project.scripts]
andhrimnir = "andhrimnir.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/andhrimnir"]
