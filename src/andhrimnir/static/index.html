<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andhrimnir</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1.5rem 2rem;
            background: #f5f5f5;
            color: #333;
        }
        h1 { margin-bottom: 0.25rem; color: #d84315; }
        .status {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 1.5rem;
        }
        .status.connected { color: #2e7d32; }
        .status.error { color: #c62828; }

        .period-chooser {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }
        .period-btn {
            padding: 0.4rem 1.1rem;
            border: 1px solid #ddd;
            border-radius: 999px;
            background: #fff;
            color: #555;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .period-btn.active {
            background: #d84315;
            color: #fff;
            border-color: #d84315;
        }
        .chart-row {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 0.75rem 1.25rem;
            margin-bottom: 0.75rem;
        }
        .chart-row .chart-label {
            font-size: 0.9rem;
            color: #777;
            width: 6rem;
            flex-shrink: 0;
            cursor: pointer;
        }
        .chart-label-input {
            font-size: 0.9rem;
            font-family: inherit;
            color: #333;
            width: 5.5rem;
            border: 1px solid #d84315;
            border-radius: 4px;
            padding: 0 0.2rem;
            outline: none;
            background: #fff;
        }
        .chart-row .chart-wrap {
            flex: 1;
            min-width: 0;
            height: 150px;
        }
        .chart-row .live-temp {
            flex-shrink: 0;
            width: 7.5rem;
            text-align: right;
        }
        .chart-row .live-temp .temp {
            font-size: 2rem;
            font-weight: 700;
            color: #d84315;
        }
        .chart-row .live-temp.disconnected .temp {
            color: #bbb;
        }

        .chart-row.alerting {
            border-color: #c62828;
            animation: alert-pulse 1s ease-in-out infinite;
        }
        @keyframes alert-pulse {
            0%, 100% { background: #fff; }
            50% { background: #ffebee; }
        }

        .threshold-inputs {
            display: flex;
            gap: 0.35rem;
            justify-content: flex-end;
            margin-top: 0.35rem;
        }
        .threshold-input {
            width: 3.5rem;
            font-size: 0.75rem;
            font-family: inherit;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 0.15rem 0.2rem;
            color: #555;
            background: #fafafa;
        }
        .threshold-input:focus {
            border-color: #d84315;
            outline: none;
        }

        .snooze-buttons {
            display: none;
            gap: 0.25rem;
            justify-content: flex-end;
            margin-top: 0.25rem;
        }
        .chart-row.alerting .snooze-buttons,
        .chart-row.snoozed .snooze-buttons {
            display: flex;
        }
        .snooze-btn {
            font-size: 0.65rem;
            padding: 0.15rem 0.4rem;
            border: 1px solid #c62828;
            border-radius: 4px;
            background: #fff;
            color: #c62828;
            cursor: pointer;
        }
        .snooze-btn:hover {
            background: #ffebee;
        }
        .chart-row.snoozed .snooze-btn { display: none; }
        .snooze-countdown {
            display: none;
            font-size: 0.65rem;
            padding: 0.15rem 0.4rem;
            border: 1px solid #999;
            border-radius: 4px;
            background: #fafafa;
            color: #777;
            cursor: pointer;
        }
        .snooze-countdown:hover { background: #eee; }
        .chart-row.snoozed .snooze-countdown { display: inline-block; }

        .stale-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: #c62828;
            color: #fff;
            padding: 0.6rem 1.25rem;
            border-radius: 10px;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
            animation: alert-pulse-banner 1s ease-in-out infinite;
        }
        .stale-banner.active { display: flex; }
        .stale-banner .stale-silence {
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border: 1px solid #fff;
            border-radius: 4px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            margin-left: 0.5rem;
            flex-shrink: 0;
        }
        .stale-banner .stale-silence:hover { background: rgba(255,255,255,0.2); }
        .stale-banner.snoozed {
            background: #999;
            animation: none;
        }
        .stale-banner.snoozed .stale-silence { display: none; }
        .stale-countdown {
            display: none;
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border: 1px solid #fff;
            border-radius: 4px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            margin-left: 0.5rem;
            flex-shrink: 0;
        }
        .stale-countdown:hover { background: rgba(255,255,255,0.2); }
        .stale-banner.snoozed .stale-countdown { display: inline-block; }
        @keyframes alert-pulse-banner {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <h1>Andhrimnir</h1>
    <div class="status" id="status">Connecting...</div>

    <div class="stale-banner" id="stale-banner">
        <span id="stale-text">No sensor data received</span>
        <span>
            <button class="stale-silence" data-minutes="1">Silent 1m</button>
            <button class="stale-silence" data-minutes="5">Silent 5m</button>
            <span class="stale-countdown" id="stale-countdown"></span>
        </span>
    </div>

    <div class="charts-section">
        <div class="period-chooser" id="period-chooser">
            <button class="period-btn active" data-hours="1">1h</button>
            <button class="period-btn" data-hours="4">4h</button>
            <button class="period-btn" data-hours="12">12h</button>
        </div>
        <div id="chart-rows"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script>
        const statusEl = document.getElementById("status");

        function cToF(c) {
            return c * 9 / 5 + 32;
        }

        function renderProbes(data) {
            renderLiveTemps(data);
            appendToCharts(data);
            checkAlerts(data);
        }

        function renderLiveTemps(data) {
            for (const [num, tempC] of Object.entries(data.probes)) {
                var el = document.getElementById("live-temp-" + num);
                if (!el) continue;
                var connected = tempC !== null;
                el.className = "live-temp" + (connected ? "" : " disconnected");
                el.querySelector(".temp").textContent = connected ? cToF(tempC).toFixed(1) + "\u00b0F" : "\u2014";
            }
            statusEl.textContent = "Last update: " + new Date(data.timestamp).toLocaleTimeString();
            statusEl.className = "status connected";
        }

        function connect() {
            const proto = location.protocol === "https:" ? "wss:" : "ws:";
            const ws = new WebSocket(proto + "//" + location.host + "/ws");

            ws.onmessage = function(event) {
                lastDataTime = Date.now();
                renderProbes(JSON.parse(event.data));
            };

            ws.onclose = function() {
                statusEl.textContent = "Disconnected. Reconnecting...";
                statusEl.className = "status error";
                setTimeout(connect, 3000);
            };

            ws.onerror = function() { ws.close(); };
        }

        function formatCountdown(ms) {
            var secs = Math.max(0, Math.ceil(ms / 1000));
            var m = Math.floor(secs / 60);
            var s = secs % 60;
            return m + ":" + (s < 10 ? "0" : "") + s;
        }

        // --- Stale data alert ---
        var lastDataTime = Date.now();
        var staleSnoozedUntil = 0;
        var STALE_TIMEOUT_MS = 60000;
        var staleBannerEl = document.getElementById("stale-banner");
        var staleTextEl = document.getElementById("stale-text");

        var staleCountdownEl = document.getElementById("stale-countdown");

        setInterval(function() {
            var now = Date.now();
            var gap = now - lastDataTime;
            var snoozed = staleSnoozedUntil && now < staleSnoozedUntil;
            if (gap >= STALE_TIMEOUT_MS) {
                staleBannerEl.classList.add("active");
                if (snoozed) {
                    staleBannerEl.classList.add("snoozed");
                    staleTextEl.textContent = "Stale data alert silenced";
                    staleCountdownEl.textContent = formatCountdown(staleSnoozedUntil - now) + " \u2715";
                } else {
                    staleBannerEl.classList.remove("snoozed");
                    var secs = Math.round(gap / 1000);
                    staleTextEl.textContent = "No sensor data for " + secs + "s";
                    beep();
                }
            } else {
                staleBannerEl.classList.remove("active", "snoozed");
                staleSnoozedUntil = 0;
            }
        }, 2000);

        document.addEventListener("click", function(e) {
            if (e.target.classList.contains("stale-silence")) {
                var minutes = parseInt(e.target.dataset.minutes, 10);
                staleSnoozedUntil = Date.now() + minutes * 60000;
            } else if (e.target.id === "stale-countdown") {
                staleSnoozedUntil = 0;
                staleBannerEl.classList.remove("snoozed");
            }
        });

        // --- Probe names ---
        var probeNames = {};   // "1" -> "Probe 1", etc.

        function fetchProbeNames() {
            return fetch("/api/probes/names")
                .then(function(r) { return r.json(); })
                .then(function(names) { probeNames = names; });
        }

        function makeEditable(labelEl) {
            var num = labelEl.dataset.probe;
            var current = labelEl.textContent;
            var input = document.createElement("input");
            input.type = "text";
            input.className = "chart-label-input";
            input.value = current;
            labelEl.textContent = "";
            labelEl.appendChild(input);
            input.focus();
            input.select();

            function commit() {
                var newName = input.value.trim() || current;
                labelEl.textContent = newName;
                probeNames[num] = newName;
                fetch("/api/probes/names/" + num, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: newName })
                }).catch(function(e) { console.error("Saving probe name failed", e); });
            }

            var committed = false;
            input.addEventListener("blur", function() {
                if (!committed) { committed = true; commit(); }
            });
            input.addEventListener("keydown", function(e) {
                if (e.key === "Enter") {
                    committed = true;
                    commit();
                } else if (e.key === "Escape") {
                    committed = true;
                    labelEl.textContent = current;
                }
            });
        }

        // --- Alert thresholds ---
        var alertThresholds = {};  // "1" -> {low: null, high: 200}, ...
        var snoozedUntil = {};     // "1" -> timestamp ms

        function fetchThresholds() {
            return fetch("/api/probes/thresholds")
                .then(function(r) { return r.json(); })
                .then(function(t) { alertThresholds = t; });
        }

        function applyThresholds() {
            document.querySelectorAll(".threshold-input").forEach(function(input) {
                var num = input.dataset.probe;
                var bound = input.dataset.bound;
                var t = alertThresholds[num];
                if (t && t[bound] !== null && t[bound] !== undefined) {
                    input.value = t[bound];
                } else {
                    input.value = "";
                }
            });
        }

        document.addEventListener("change", function(e) {
            if (!e.target.classList.contains("threshold-input")) return;
            var num = e.target.dataset.probe;
            var bound = e.target.dataset.bound;
            var val = e.target.value.trim();
            var parsed = val === "" ? null : parseFloat(val);
            if (val !== "" && isNaN(parsed)) return;
            if (!alertThresholds[num]) alertThresholds[num] = {low: null, high: null};
            alertThresholds[num][bound] = parsed;
            fetch("/api/probes/thresholds/" + num, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(alertThresholds[num])
            }).catch(function(e) { console.error("Saving threshold failed", e); });
        });

        document.addEventListener("click", function(e) {
            if (e.target.classList.contains("snooze-btn")) {
                var num = e.target.dataset.probe;
                var minutes = parseInt(e.target.dataset.minutes, 10);
                snoozedUntil[num] = Date.now() + minutes * 60000;
                var row = document.getElementById("chart-row-" + num);
                if (row) {
                    row.classList.remove("alerting");
                    row.classList.add("snoozed");
                }
            } else if (e.target.classList.contains("snooze-countdown")) {
                var num = e.target.dataset.probe;
                snoozedUntil[num] = 0;
                var row = document.getElementById("chart-row-" + num);
                if (row) row.classList.remove("snoozed");
            }
        });

        var audioCtx = null;
        function beep() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = "square";
            osc.frequency.value = 880;
            gain.gain.value = 0.15;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function checkAlerts(data) {
            var now = Date.now();
            var anyAlerting = false;
            for (var num in data.probes) {
                var tempC = data.probes[num];
                var row = document.getElementById("chart-row-" + num);
                if (!row) continue;
                var t = alertThresholds[num];
                if (!t || tempC === null) {
                    row.classList.remove("alerting", "snoozed");
                    continue;
                }
                var tempF = cToF(tempC);
                var tripped = (t.low !== null && tempF < t.low) || (t.high !== null && tempF > t.high);
                var snoozed = snoozedUntil[num] && now < snoozedUntil[num];
                if (snoozed) {
                    row.classList.remove("alerting");
                    row.classList.add("snoozed");
                    var cd = row.querySelector(".snooze-countdown");
                    if (cd) cd.textContent = formatCountdown(snoozedUntil[num] - now) + " \u2715";
                } else if (tripped) {
                    row.classList.add("alerting");
                    row.classList.remove("snoozed");
                    anyAlerting = true;
                } else {
                    row.classList.remove("alerting", "snoozed");
                }
            }
            if (anyAlerting) beep();
        }

        // --- Charts ---
        var syncingTooltips = false;
        Chart.register({
            id: "syncTooltips",
            afterEvent: function(chart, args) {
                if (syncingTooltips) return;
                var evt = args.event;
                if (evt.type === "mouseout") {
                    syncingTooltips = true;
                    Object.values(charts).forEach(function(c) {
                        if (c !== chart) {
                            c.setActiveElements([]);
                            c.tooltip.setActiveElements([], {x: 0, y: 0});
                            c.update("none");
                        }
                    });
                    syncingTooltips = false;
                    return;
                }
                if (evt.type !== "mousemove") return;
                var active = chart.getActiveElements();
                if (!active.length) return;
                var activePoint = active[0];
                var dataX = chart.data.datasets[activePoint.datasetIndex].data[activePoint.index].x;
                var timestamp = dataX instanceof Date ? dataX.getTime() : dataX;
                syncingTooltips = true;
                Object.values(charts).forEach(function(c) {
                    if (c === chart) return;
                    var ds = c.data.datasets[0].data;
                    var bestIdx = -1, bestDist = Infinity;
                    for (var i = 0; i < ds.length; i++) {
                        if (ds[i].y === null) continue;
                        var t = ds[i].x instanceof Date ? ds[i].x.getTime() : ds[i].x;
                        var d = Math.abs(t - timestamp);
                        if (d < bestDist) { bestDist = d; bestIdx = i; }
                    }
                    if (bestIdx >= 0 && bestDist < 30000) {
                        var pt = c.getDatasetMeta(0).data[bestIdx];
                        c.setActiveElements([{datasetIndex: 0, index: bestIdx}]);
                        c.tooltip.setActiveElements([{datasetIndex: 0, index: bestIdx}], {x: pt.x, y: pt.y});
                    } else {
                        c.setActiveElements([]);
                        c.tooltip.setActiveElements([], {x: 0, y: 0});
                    }
                    c.update("none");
                });
                syncingTooltips = false;
            }
        });

        var charts = {};       // probeNum -> Chart instance
        var chartData = {};    // probeNum -> [{x: Date, y: tempF}, ...]
        var selectedHours = 1;
        var chartRowsEl = document.getElementById("chart-rows");

        function sinceISO(hours) {
            return new Date(Date.now() - hours * 3600000).toISOString();
        }

        function buildCharts(history) {
            // history is array of {timestamp, probes: {1: val, ...}}, newest-first
            // Destroy old charts
            Object.values(charts).forEach(function(c) { c.destroy(); });
            charts = {};
            chartData = {};
            chartRowsEl.innerHTML = "";

            // Group by probe, filter probes that have at least one non-null reading
            var probeNums = ["1","2","3","4","5","6"];
            probeNums.forEach(function(num) {
                var points = [];
                for (var i = history.length - 1; i >= 0; i--) {
                    var r = history[i];
                    var v = r.probes[num];
                    if (v !== null) {
                        points.push({ x: new Date(r.timestamp), y: cToF(v) });
                    }
                }
                if (points.length === 0) return;
                // Insert nulls at gaps > 60s to break the line
                var gapped = [points[0]];
                for (var j = 1; j < points.length; j++) {
                    if (points[j].x - points[j - 1].x > 60000) {
                        gapped.push({ x: new Date(points[j - 1].x.getTime() + 1), y: null });
                    }
                    gapped.push(points[j]);
                }
                points = gapped;
                chartData[num] = points;

                var label = probeNames[num] || ("Probe " + num);
                var row = document.createElement("div");
                row.className = "chart-row";
                row.id = "chart-row-" + num;
                row.innerHTML =
                    '<div class="chart-label" data-probe="' + num + '">' + label + '</div>' +
                    '<div class="chart-wrap"><canvas id="chart-' + num + '"></canvas></div>' +
                    '<div class="live-temp" id="live-temp-' + num + '">' +
                        '<div class="temp">\u2014</div>' +
                        '<div class="threshold-inputs">' +
                            '<input class="threshold-input" data-probe="' + num + '" data-bound="low" placeholder="Lo \u00b0F">' +
                            '<input class="threshold-input" data-probe="' + num + '" data-bound="high" placeholder="Hi \u00b0F">' +
                        '</div>' +
                        '<div class="snooze-buttons">' +
                            '<button class="snooze-btn" data-probe="' + num + '" data-minutes="1">Silent 1m</button>' +
                            '<button class="snooze-btn" data-probe="' + num + '" data-minutes="5">Silent 5m</button>' +
                            '<span class="snooze-countdown" data-probe="' + num + '"></span>' +
                        '</div>' +
                    '</div>';
                chartRowsEl.appendChild(row);
                row.querySelector(".chart-label").addEventListener("click", function(e) {
                    if (e.target.tagName === "INPUT") return;
                    makeEditable(e.currentTarget);
                });

                var ctx = document.getElementById("chart-" + num).getContext("2d");
                charts[num] = new Chart(ctx, {
                    type: "line",
                    data: {
                        datasets: [{
                            data: points,
                            borderColor: "#d84315",
                            backgroundColor: "rgba(216,67,21,0.08)",
                            borderWidth: 2,
                            pointRadius: 0,
                            fill: true,
                            tension: 0.25
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: "nearest", axis: "x", intersect: false },
                        plugins: { legend: { display: false } },
                        scales: {
                            x: {
                                type: "time",
                                time: { tooltipFormat: "HH:mm:ss" },
                                afterBuildTicks: function(scale) {
                                    var range = scale.max - scale.min;
                                    var minutes = range / 60000;
                                    var nice = [1, 2, 5, 10, 15, 30, 60, 120, 360, 720, 1440];
                                    var target = Math.max(2, Math.floor(scale.width / 100));
                                    var raw = minutes / target;
                                    var step = nice.find(function(n) { return n >= raw; }) || nice[nice.length - 1];
                                    var stepMs = step * 60000;
                                    var first = Math.ceil(scale.min / stepMs) * stepMs;
                                    var ticks = [];
                                    for (var t = first; t <= scale.max; t += stepMs) {
                                        ticks.push({ value: t });
                                    }
                                    scale.ticks = ticks;
                                }
                            },
                            y: {
                                title: { display: true, text: "\u00b0F" }
                            }
                        },
                        animation: false
                    }
                });
            });
            applyThresholds();
        }

        function fetchHistory() {
            var since = sinceISO(selectedHours);
            var limit = selectedHours * 2000;
            fetch("/api/temperatures/history?since=" + encodeURIComponent(since) + "&limit=" + limit)
                .then(function(r) { return r.json(); })
                .then(buildCharts)
                .catch(function(e) { console.error("Fetching history failed", e); });
        }

        // Period button clicks
        document.getElementById("period-chooser").addEventListener("click", function(e) {
            var btn = e.target.closest(".period-btn");
            if (!btn) return;
            document.querySelectorAll(".period-btn").forEach(function(b) { b.classList.remove("active"); });
            btn.classList.add("active");
            selectedHours = parseInt(btn.dataset.hours, 10);
            fetchHistory();
        });

        // Append live reading to existing charts
        function appendToCharts(data) {
            var ts = new Date(data.timestamp);
            var cutoff = new Date(Date.now() - selectedHours * 3600000);
            Object.keys(charts).forEach(function(num) {
                var v = data.probes[num];
                if (v === null) return;
                var pts = chartData[num];
                // Insert null to break line if gap > 60s since last real point
                var last = pts[pts.length - 1];
                if (last && last.y !== null && ts - last.x > 60000) {
                    pts.push({ x: new Date(last.x.getTime() + 1), y: null });
                }
                pts.push({ x: ts, y: cToF(v) });
                // Trim old points outside window
                while (pts.length > 0 && pts[0].x < cutoff) pts.shift();
                charts[num].data.datasets[0].data = pts;
                charts[num].update();
            });
        }

        fetch("/api/temperatures")
            .then(function(r) { return r.json(); })
            .then(renderProbes)
            .catch(function(e) { console.error("Fetching current temperatures failed", e); });

        connect();
        Promise.all([fetchProbeNames(), fetchThresholds()]).catch(function(e) {
            console.error("Fetching probe names/thresholds failed; charting anyway", e);
        }).then(fetchHistory);
    </script>
</body>
</html>
