esphome:
  name: esp32-bluetooth-proxy-a034a0

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

wifi:
  ssid: REDACTED
  password: REDACTED

api:
  reboot_timeout: 0s
  max_send_queue: 32

logger:
  level: DEBUG

ota:
    platform: esphome

# Remote reboot without a power cycle (visible via the API).
button:
  - platform: restart
    name: Restart

# Low-duty scan: we only scan to discover the device before connecting
# (readings arrive over the GATT connection).  A 100% scan window starves
# WiFi via radio coexistence once a BLE connection is up, which freezes the
# API/network stack on this board.
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: true

esp32_ble:
  max_connections: 4

bluetooth_proxy:
  active: true
